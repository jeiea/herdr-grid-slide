# Before dispatching from the default branch:
# 1. `mise run bump -- <MAJOR.MINOR.PATCH>` and `mise run check`; CI must pass on
#    Linux, macOS, and Windows x64.
# 2. `mise run live-herdr` with Herdr 0.8.2 and with
#    `HERDR_TEST_VERSION='herdr 0.9.0'`.
# 3. Run the manual connected-client checks described in tests/live_herdr_test.rs.
# Never create the tag by hand. If cancellation or an API failure skips the
# cleanup job, inspect with `gh release view v<version> --json isDraft,assets`
# and remove an incomplete draft with `gh release delete v<version> --cleanup-tag`
# before dispatching the same version again.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Install configured ShellCheck and Deno
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          install_args: shellcheck deno
      - name: Require public repository and default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = "$GITHUB_REF_NAME"
      - name: Verify version and unused tag
        id: version
        run: |
          version=$(./scripts/check-version.sh --release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Run release quality gate
        run: ./.mise/tasks/check.sh

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.97.1
      - name: Install musl linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux') || startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Install configured Deno
        if: runner.os == 'Windows'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          install_args: deno
      - name: Test Windows transport and installer
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Smoke test and stage asset
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          binary="target/$TARGET/release/herdr-grid-slide$EXTENSION"
          status=0
          output=$("$binary" 2>&1) || status=$?
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F "usage:"
          case "$TARGET" in
            *-unknown-linux-musl)
              linkage=$(ldd "$binary" 2>&1 || true)
              case "$linkage" in
                *"statically linked"* | *"not a dynamic executable"*) ;;
                *) echo "binary is not statically linked: $linkage" >&2; exit 1 ;;
              esac
              ;;
          esac
          cp "$binary" "herdr-grid-slide-v${VERSION}-${TARGET}${EXTENSION}"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: herdr-grid-slide-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify assets and create checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc.exe
          do
            test -f "dist/herdr-grid-slide-v${VERSION}-${target}"
          done
          test "$(find dist -type f | wc -l)" -eq 5
          cd dist
          sha256sum herdr-grid-slide-* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/herdr-grid-slide-*
      - name: Create draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
          gh release upload "$TAG" \
            dist/herdr-grid-slide-* \
            dist/SHA256SUMS
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          trap 'rm -f "$expected" "$actual"' EXIT
          printf '%s\n' \
            SHA256SUMS \
            "herdr-grid-slide-v${VERSION}-aarch64-apple-darwin" \
            "herdr-grid-slide-v${VERSION}-aarch64-unknown-linux-musl" \
            "herdr-grid-slide-v${VERSION}-x86_64-apple-darwin" \
            "herdr-grid-slide-v${VERSION}-x86_64-unknown-linux-musl" \
            "herdr-grid-slide-v${VERSION}-x86_64-pc-windows-msvc.exe" \
            | sort > "$expected"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > "$actual"
          diff -u "$expected" "$actual"
          gh release edit "$TAG" --draft=false
      - name: Clean up an incomplete release
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || \
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
