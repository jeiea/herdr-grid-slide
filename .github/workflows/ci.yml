name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Install configured ShellCheck and Deno
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          install_args: shellcheck deno
      - name: Run quality gate
        run: ./.mise/tasks/check.sh

  macos:
    name: macOS integration
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise and configured Rust
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          install_args: rust deno
      - name: Test common tasks
        run: |
          sh tests/apply_local_test.sh
          deno test -A tests/*.ts
      - name: Test installer
        run: sh tests/install_test.sh
      - name: Run integration tests
        run: cargo test --locked --test integration_test
      - name: Run live Herdr 0.8.0 tests
        env:
          MISE_AUTO_INSTALL: "false"
        run: mise run test-herdr-0.8.0

  windows:
    name: Windows x64 integration
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Check Windows code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install configured Deno
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          install_args: deno
      - name: Test common tasks
        run: deno test -A tests/*.ts
      - name: Run Rust and PowerShell installer tests
        run: cargo test --locked
