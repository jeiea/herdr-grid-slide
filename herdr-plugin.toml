id = "jeiea.move-pane"
name = "Move Pane"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Move panes or focus across tabs and workspaces, create tabs and workspaces, reorder workspaces, add panes and balance tab layouts"
platforms = ["macos", "linux"]

[[build]]
command = ["./scripts/build-plugin.sh"]

[[actions]]
id = "to-next-workspace"
title = "Move pane to next workspace"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "workspace", "next"]

[[actions]]
id = "to-previous-workspace"
title = "Move pane to previous workspace"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "workspace", "previous"]

[[actions]]
id = "to-next-tab"
title = "Move pane to next tab"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "tab", "next"]

[[actions]]
id = "to-previous-tab"
title = "Move pane to previous tab"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "tab", "previous"]

[[actions]]
id = "new-tab"
title = "Create tab to the right"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "new-tab"]

[[actions]]
id = "new-workspace"
title = "Create workspace after current"
contexts = ["workspace"]
command = ["./bin/herdr-move-pane", "new-workspace"]

[[actions]]
id = "to-new-tab"
title = "Move pane to new tab"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "to-new-tab"]

[[actions]]
id = "to-new-workspace"
title = "Move pane to new workspace"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "to-new-workspace"]

[[actions]]
id = "move-workspace-next"
title = "Move workspace itself to next position"
contexts = ["workspace"]
command = ["./bin/herdr-move-pane", "move-workspace", "next"]

[[actions]]
id = "move-workspace-previous"
title = "Move workspace itself to previous position"
contexts = ["workspace"]
command = ["./bin/herdr-move-pane", "move-workspace", "previous"]

[[actions]]
id = "focus-left"
title = "Focus left pane or wrap to previous tab"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "focus", "left"]

[[actions]]
id = "focus-down"
title = "Focus lower pane or wrap to next workspace"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "focus", "down"]

[[actions]]
id = "focus-up"
title = "Focus upper pane or wrap to previous workspace"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "focus", "up"]

[[actions]]
id = "focus-right"
title = "Focus right pane or wrap to next tab"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "focus", "right"]

[[actions]]
id = "split-pane"
title = "Split pane"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "split-pane"]

[[actions]]
id = "new-pane"
title = "Create pane"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "new-pane"]

[[actions]]
id = "balance"
title = "Balance panes into even grid"
contexts = ["pane"]
command = ["./bin/herdr-move-pane", "balance"]

[[events]]
on = "pane.focused"
command = ["./bin/herdr-move-pane", "on-pane-focused"]
