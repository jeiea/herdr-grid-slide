[package]
name = "herdr-move-pane"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Move or focus Herdr panes cyclically across tabs and workspaces"
license = "MIT"
repository = "https://github.com/jeiea/herdr-move-pane"
readme = "README.md"
keywords = ["herdr", "pane", "navigation"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = true
