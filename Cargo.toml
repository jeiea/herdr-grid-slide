[package]
name = "herdr-grid-slide"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Move focus, panes and tabs across Herdr tabs and workspaces, with automatic grid balancing"
license = "MIT"
repository = "https://github.com/jeiea/herdr-grid-slide"
readme = "README.md"
keywords = ["herdr", "pane", "navigation"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.2"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = true
